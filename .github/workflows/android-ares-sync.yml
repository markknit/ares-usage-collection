name: ARES Sync Android

on:
  push:
    paths:
      - 'android/ares-sync/**'
      - '.github/workflows/android-ares-sync.yml'
  pull_request:
    paths:
      - 'android/ares-sync/**'
      - '.github/workflows/android-ares-sync.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle -p android/ares-sync :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ares-sync-debug-apk
          path: android/ares-sync/app/build/outputs/apk/debug/app-debug.apk
